[project]
name = "rotation-curve"
version = "0.1.0"
description = "Dark matter analysis using Gaia DR2 stellar kinematics"
requires-python = ">=3.9"
dependencies = [
    "astropy>=6.0",
    "astroquery>=0.4.7",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.scripts]
dm = "cli:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rotation_curve"]
include  = ["cli.py"]
